spring:
  application:
    name: interest-service

  datasource:
    url: jdbc:postgresql://postgres-interest:5432/interest_db
    username: interest
    password: interest
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8088
