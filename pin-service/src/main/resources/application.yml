spring:
  application:
    name: pin-service

  datasource:
    url: jdbc:postgresql://postgres-pin:5432/pin_db
    username: pin
    password: pin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8086
