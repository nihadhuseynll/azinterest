spring:
  application:
    name: search-service

  datasource:
    url: jdbc:postgresql://postgres-search:5432/search_db
    username: search
    password: search
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8087
