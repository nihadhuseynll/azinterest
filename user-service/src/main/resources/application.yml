spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres-user:5432/user_db
    username: user
    password: user
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/azinterest/protocol/openid-connect/certs
logging:
  level:
    org.springframework.security: DEBUG
server:
  port: 8084